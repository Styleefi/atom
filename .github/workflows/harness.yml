name: harness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Same job image as .gitlab-ci.yml — both forges verify one environment contract.
    container: ghcr.io/astral-sh/uv:python3.14-trixie
    steps:
      - uses: actions/checkout@v7
      - run: uv sync --locked --directory meta
      - run: uv run --directory meta pytest
      - run: uv run --directory meta python -m harness.rules_checker
